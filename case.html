<style>
:root{
  --bg:#050508; --bg2:#111217; --ink:#F1F1EE; --dim:#9A9AA0; --faint:rgba(154,154,160,.52);
  --accent:#7F64D0; --accent-2:#A38FE3; --line:rgba(241,241,238,.12);
  --brand:#7F64D0;                       /* overridden per case */
  --pad:clamp(20px,5vw,60px); --maxw:1180px;

  /* Same motion set as the main site — the case pages were running their
     own slightly different timings, which read as a different product. */
  --e-rise:cubic-bezier(.2,.7,.2,1);
  --e-media:cubic-bezier(.2,0,0,1);
  --t-tap:.18s; --t-ui:.3s; --t-media:.6s; --t-rise:.9s;
}
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
body{ background:var(--bg); color:var(--ink); font-family:'DM Sans',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
/* cinematic ambience: a teal wash from one corner, deep purple from the
   other — light, not neon; the page stays 80% charcoal */
body::before{ content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; background:
  radial-gradient(900px 700px at 88% 8%, rgba(62,156,142,.14), transparent 70%),
  radial-gradient(1000px 800px at 6% 92%, rgba(127,100,208,.11), transparent 70%),
  var(--bg); }
img,video{ display:block; max-width:100%; }
a{ color:inherit; text-decoration:none; }
::selection{ background:var(--accent); color:#fff; }
h1,h2,h3{ font-family:'Anton',sans-serif; font-weight:400; letter-spacing:.005em; line-height:.98; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
.wrap{ max-width:var(--maxw); margin:0 auto; padding-inline:var(--pad); }
.eyebrow{ display:inline-flex; align-items:center; gap:10px; font-size:11px; font-weight:600; letter-spacing:.3em; text-transform:uppercase; color:var(--brand); }
.eyebrow::before{ content:""; width:26px; height:1px; background:var(--brand); }

/* bar */
.bar{ position:fixed; top:0; left:0; right:0; z-index:80; display:flex; align-items:center; justify-content:space-between;
  padding:calc(14px + env(safe-area-inset-top)) var(--pad) 14px; background:linear-gradient(to bottom, rgba(5,5,8,.85), transparent); }
.bar.solid{ background:rgba(5,5,8,.82); backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
.back{ display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--ink); padding:10px 0; min-height:44px; }
.back:hover{ color:var(--accent-2); }
.bar .brand{ display:flex; align-items:center; gap:8px; font-family:'Anton'; font-weight:400; font-size:15px; }
.bar .brand svg{ width:20px; height:18px; color:var(--accent-2); }
/* 3D mark — same endless Y-axis turn as the home page: five copies fanned
   along Z (silver faces, dark core) so the edge shows instead of vanishing */
.spin3d{ display:inline-flex; perspective:460px; }
.spin3d .s3o{ position:relative; display:inline-flex; transform-style:preserve-3d; animation:logoSpin 8s linear infinite; will-change:transform; }
.spin3d svg{ display:block; }
.spin3d svg:not(:first-child){ position:absolute; left:0; top:0; }
.spin3d svg:nth-child(1){ transform:translateZ(3px); animation:logoGlint 8s linear infinite; }
.spin3d svg:nth-child(2){ transform:translateZ(1.5px); filter:brightness(.45); }
.spin3d svg:nth-child(3){ filter:brightness(.45); }
.spin3d svg:nth-child(4){ transform:translateZ(-1.5px); filter:brightness(.45); }
.spin3d svg:nth-child(5){ transform:translateZ(-3px); animation:logoGlint 8s linear infinite; }
@keyframes logoSpin{ to{ transform:rotateY(360deg); } }
@keyframes logoGlint{ 0%,50%,100%{ filter:brightness(1); } 25%,75%{ filter:brightness(1.55); } }
.wa-mini{ font-size:12px; font-weight:600; padding:12px 18px; border-radius:100px; background:var(--accent); color:#fff; }
.wa-mini:hover{ background:#6C52C2; }
@media(max-width:640px){ .bar .brand>span:not(.spin3d){ display:none; } }

/* hero */
.hero{ position:relative; min-height:88svh; display:flex; align-items:flex-end; overflow:hidden; }
.hero .bgm{ position:absolute; inset:0; }
.hero .bgm img,.hero .bgm video{ width:100%; height:100%; object-fit:cover; opacity:.42; }
.hero::after{ content:""; position:absolute; inset:0; background:linear-gradient(to bottom, rgba(5,5,8,.72) 0%, rgba(5,5,8,.34) 38%, rgba(5,5,8,.99) 92%); }
.hero-in{ position:relative; z-index:2; width:100%; padding-block:clamp(40px,7vh,80px); }
.hero h1{ font-size:clamp(34px,6.8vw,84px); margin-top:14px; }
.hero .sub{ margin-top:14px; color:var(--dim); font-size:clamp(14px,1.7vw,17px); max-width:54ch; }
.meta{ margin-top:clamp(26px,4vh,40px); display:grid; grid-template-columns:repeat(2,1fr); gap:18px 20px; border-top:1px solid var(--line); padding-top:20px; }
.meta small{ display:block; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--faint); margin-bottom:5px; }
.meta b{ font-weight:600; font-size:14px; }

/* sections */
.sec{ content-visibility:auto; contain-intrinsic-size:auto 720px; padding-block:clamp(64px,11vh,120px); }
.two{ display:grid; grid-template-columns:1fr; gap:clamp(30px,5vh,52px); }
.blk h2{ font-size:clamp(24px,3.6vw,40px); margin:12px 0 14px; }
.blk p{ color:var(--dim); font-size:clamp(15px,1.8vw,17px); line-height:1.72; max-width:58ch; }

/* execution — masonry columns, so every image keeps its own shape.
   A square social post, a 16:9 film frame and a portrait studio shot all
   sit in the same wall without any of them being cropped to fit. */
.gal{ display:flex; align-items:flex-start; gap:clamp(14px,2vw,22px); margin-top:clamp(26px,4vh,44px); }
.gcol{ flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:clamp(14px,2vw,22px); }
.gi{ position:relative; border:1px solid var(--line); border-radius:14px; overflow:hidden; background:var(--bg2); }
/* a tile that holds film says so — black frames were reading as broken images */
.gi:has(video)::before{ content:"▶"; position:absolute; top:12px; right:12px; z-index:2; width:34px; height:34px;
  display:grid; place-items:center; font-size:12px; color:#fff; background:rgba(5,5,8,.62);
  border:1px solid rgba(241,241,238,.28); border-radius:100px; backdrop-filter:blur(6px); pointer-events:none; }
.gi img,.gi video{ width:100%; height:auto; display:block; transition:transform var(--t-media) var(--e-media); }
.gi:hover img,.gi:hover video{ transform:scale(1.04); }
.gi figcaption{ padding:12px 14px; font-size:11.5px; letter-spacing:.06em; color:var(--faint); border-top:1px solid var(--line); }

/* chapters — for cases with more than one body of work */
.chap{ margin-top:clamp(46px,8vh,96px); }
.chap:first-of-type{ margin-top:0; }
.chap-n{ font-family:'Anton'; font-weight:400; font-size:12px; letter-spacing:.22em; color:var(--brand); }
.chap-k{ font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--faint); margin-left:12px; }
.chap h3{ font-size:clamp(23px,4vw,42px); letter-spacing:.005em; line-height:1.05; margin-top:14px; }
.chap > p{ color:var(--dim); font-size:clamp(15px,1.8vw,17px); line-height:1.72; max-width:58ch; margin-top:14px; }

/* result */
.result{ border-block:1px solid var(--line); background:rgba(17,18,23,.55); }
.res-stat{ font-family:'Anton'; font-weight:400; font-size:clamp(50px,11vw,128px); line-height:.92; color:var(--brand); letter-spacing:.005em; }
.res-lab{ font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--faint); margin-top:10px; }
/* Cases with no measured number carry a stated outcome instead, at the same
   visual weight — so the section never reads as a missing metric. */
.res-pull{ font-family:'Anton'; font-weight:400; font-size:clamp(27px,5vw,56px); line-height:1.04; color:var(--brand); letter-spacing:.005em; max-width:20ch; }
.res-text{ margin-top:clamp(18px,3vh,26px); font-size:clamp(16px,2.2vw,22px); color:var(--ink); max-width:46ch; line-height:1.55; font-family:'DM Sans'; font-weight:600; letter-spacing:-.01em; }

/* next + cta */
.next{ display:block; padding-block:clamp(50px,9vh,96px); border-bottom:1px solid var(--line); }
.next small{ font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:var(--faint); }
.next h2{ font-size:clamp(30px,6.4vw,72px); margin-top:12px; transition:color var(--t-tap), transform var(--t-media) var(--e-rise); }
.next:hover h2{ color:var(--accent-2); transform:translateY(-4px); }
.cta{ text-align:center; padding-block:clamp(60px,10vh,110px); }
.cta h2{ font-size:clamp(30px,6vw,68px); text-transform:uppercase; }
.cta h2 span{ color:var(--accent-2); }
.btn{ display:inline-flex; align-items:center; gap:9px; margin-top:26px; font-weight:600; font-size:15px; padding:16px 28px; border-radius:100px; background:var(--accent); color:#fff; }
.btn:hover{ background:#6C52C2; }
.cta-row{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
.btn.ghost{ background:transparent; border:1px solid var(--line); color:var(--ink); }
.btn.ghost:hover{ border-color:var(--accent); background:transparent; color:var(--accent-2); }
footer{ padding:26px var(--pad); color:var(--faint); font-size:12.5px; text-align:center; }

/* chapter index — one line under "The work.", so a long case reads as a map */
.chnav{ display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; }
.chnav a{ font-size:12px; font-weight:600; letter-spacing:.04em; color:var(--dim); border:1px solid var(--line); border-radius:100px; padding:9px 15px; transition:color var(--t-tap), border-color var(--t-tap); }
.chnav a:hover{ color:var(--ink); border-color:var(--brand); }
.chnav a b{ color:var(--brand); font-weight:700; margin-right:7px; }

/* lightbox — any tile opens full-screen; videos get their sound back */
.gi{ cursor:zoom-in; }
.lb{ position:fixed; inset:0; z-index:120; background:rgba(5,5,9,.94); backdrop-filter:blur(10px);
  display:flex; flex-direction:column; align-items:center; justify-content:center; padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
  opacity:0; visibility:hidden; transition:opacity var(--t-media) var(--e-rise), visibility var(--t-media); }
.lb.open{ opacity:1; visibility:visible; }
.lb img,.lb video{ max-width:min(100%,1100px); max-height:82svh; width:auto; height:auto; border-radius:12px; }
.lb figcaption{ margin-top:14px; font-size:13px; letter-spacing:.05em; color:var(--dim); text-align:center; }
.lb-x{ position:absolute; top:calc(16px + env(safe-area-inset-top)); right:18px; width:46px; height:46px; border-radius:100px; border:1px solid var(--line); background:rgba(17,18,23,.7); color:var(--ink); font-size:20px; cursor:pointer; display:grid; place-items:center; }
.lb-x:hover{ border-color:var(--brand); }
@media(prefers-reduced-motion:reduce){
  .hv,.hv::before,.hv-lift{ transition:none; }
  .hv:hover,.hv-lift:hover,.hv:active,.hv-lift:active{ transform:none; } .lb{ transition:none; } }


/* rise motion */
.up{ opacity:0; transform:translateY(36px); transition:opacity var(--t-rise) var(--e-rise), transform var(--t-rise) var(--e-rise); transition-delay:var(--d,0ms); }
.up.in{ opacity:1; transform:none; }

/* ── presence ──────────────────────────────────────────────────────────
   Interactive elements lean toward the cursor: a breath of scale, a lift,
   and a soft brand-purple glow. The glow lives on a ::before layer and
   only its opacity animates, so any number of elements stay cheap.
   Touch devices get a press state instead of a hover they cannot make. */
.hv.hv{ position:relative; transition:transform .42s var(--e-rise), background var(--t-ui), color var(--t-tap), border-color var(--t-tap), opacity var(--t-ui); }
.hv::before{ content:""; position:absolute; inset:-1px; border-radius:inherit; pointer-events:none; opacity:0;
  box-shadow:0 0 0 1px rgba(163,143,227,.26), 0 10px 30px -8px rgba(127,100,208,.5), 0 24px 64px -20px rgba(127,100,208,.38);
  transition:opacity .42s var(--e-rise); }
.hv:focus-visible::before{ opacity:1; }
.hv:active{ transform:translateY(-1px) scale(.985); transition-duration:.14s; }
/* lift-only cousin, for elements whose pseudo layers are already spoken for */
.hv-lift.hv-lift{ transition:transform .42s var(--e-rise); }
.hv-lift:active{ transform:scale(.975); transition-duration:.14s; }
@media(hover:hover) and (pointer:fine){
  .hv:hover{ transform:translateY(-4px) scale(1.035); z-index:5; }
  .hv:hover::before{ opacity:1; }
  .hv-lift:hover{ transform:translateY(-4px) scale(1.03); }
}
@media(hover:none){
  .hv:active{ transform:scale(.965); }
  .hv:active::before{ opacity:.9; transition-duration:.12s; }
}


/* ── 3D walkthrough ────────────────────────────────────────────────────
   Without WebGL (or before tour.js arrives) the stops are plain cards
   under a still. Once tour.js mounts, .live pins a full-screen stage and
   the page's scroll drives the camera; the cards take turns over it. */
.tour{ padding-block:clamp(64px,11vh,120px) 0; }
.tour-head h2{ font-size:clamp(24px,3.6vw,40px); margin-top:12px; }
.tour-hint{ color:var(--dim); margin-top:10px; font-size:14px; }
.tour-pin{ position:relative; }
.tour-poster{ width:100%; max-width:var(--maxw); margin:clamp(24px,4vh,40px) auto 0; aspect-ratio:16/9; object-fit:cover; border-radius:14px; border:1px solid var(--line); }
.tour-cards{ list-style:none; display:grid; gap:16px; max-width:var(--maxw); margin:22px auto 0; padding-inline:var(--pad); }
@media(min-width:700px){ .tour-cards{ grid-template-columns:repeat(2,1fr); } }
.tcard{ border:1px solid var(--line); border-radius:14px; background:rgba(17,18,23,.78); padding:20px 20px 22px; }
.tcard .tk{ font-size:11px; font-weight:600; letter-spacing:.24em; text-transform:uppercase; color:var(--brand); }
.tcard h3{ font-size:clamp(20px,2.4vw,28px); line-height:1.05; margin-top:10px; }
.tcard p{ color:var(--dim); font-size:14.5px; line-height:1.65; margin-top:10px; }
.draft-note{ display:inline-block; margin-top:14px; font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
  color:#1a1206; background:var(--brand); border-radius:100px; padding:7px 12px; }

/* before / after — image pair with a drag handle */
.cmp{ position:relative; margin-top:14px; border-radius:10px; overflow:hidden; border:1px solid var(--line); --x:50%; aspect-ratio:4/3; }
.cmp img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.cmp .cmp-b{ clip-path:inset(0 calc(100% - var(--x)) 0 0); }
.cmp::after{ content:""; position:absolute; top:0; bottom:0; left:var(--x); width:2px; margin-left:-1px; background:#fff; box-shadow:0 0 12px rgba(0,0,0,.5); pointer-events:none; }
.cmp input{ position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:ew-resize; margin:0; }
.cmp small{ position:absolute; bottom:8px; font-size:10px; letter-spacing:.2em; text-transform:uppercase; background:rgba(5,5,8,.7); padding:4px 8px; border-radius:100px; pointer-events:none; }
.cmp .l{ left:8px; } .cmp .r{ right:8px; }
/* before / after — in the 3D room itself */
.cmp3{ display:flex; align-items:center; gap:12px; margin-top:16px; font-size:11px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--dim); }
.cmp3 input{ flex:1; accent-color:var(--brand); min-height:32px; }
.tour:not(.live) .cmp3{ display:none; }

.tour.live .tour-stage{ height:calc(var(--n) * 110svh + 40svh); margin-top:clamp(24px,4vh,40px); }
.tour.live .tour-pin{ position:sticky; top:0; height:100svh; overflow:hidden; }
.tour.live .tour-poster{ display:none; }
.tour-cv{ position:absolute; inset:0; width:100%; height:100%; display:block; }
.tour.live .tour-pin::after{ content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(to bottom, var(--bg) 0, transparent 14%, transparent 70%, rgba(5,5,8,.85) 100%); }
.tour.live .tour-cards{ position:absolute; z-index:3; left:0; right:0; bottom:calc(28px + env(safe-area-inset-bottom)); margin:0; display:block; pointer-events:none; }
.tour.live .tcard{ position:absolute; left:var(--pad); bottom:0; width:min(400px, calc(100% - 2 * var(--pad)));
  background:rgba(10,10,14,.72); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  opacity:0; transform:translateY(18px); transition:opacity var(--t-media) var(--e-rise), transform var(--t-media) var(--e-rise); }
.tour.live .tcard.on{ opacity:1; transform:none; pointer-events:auto; }
.tour-load{ position:absolute; inset:0; display:grid; place-items:center; color:var(--dim); font-size:13px; letter-spacing:.14em; text-transform:uppercase; }
.tour-spot{ position:absolute; z-index:2; left:0; top:0; width:18px; height:18px; margin:-9px 0 0 -9px; border-radius:50%;
  background:var(--brand); box-shadow:0 0 0 0 var(--brand); opacity:0; transition:opacity var(--t-ui); pointer-events:none; }
.tour-spot.on{ opacity:1; animation:spotPulse 2s var(--e-rise) infinite; }
@keyframes spotPulse{ 0%{ box-shadow:0 0 0 0 color-mix(in srgb, var(--brand) 70%, transparent); } 100%{ box-shadow:0 0 0 22px transparent; } }
.tour-rail{ position:absolute; z-index:3; right:calc(var(--pad) - 12px); top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:2px; }
.tour-rail button{ width:36px; height:36px; display:grid; place-items:center; background:none; border:0; cursor:pointer; }
.tour-rail span{ width:8px; height:8px; border-radius:50%; border:1px solid var(--ink); opacity:.5; transition:all var(--t-ui); }
.tour-rail .on span{ background:var(--brand); border-color:var(--brand); opacity:1; transform:scale(1.35); }
.tour-tune{ position:absolute; z-index:4; top:80px; left:var(--pad); font:12px/1.5 ui-monospace,monospace; background:rgba(0,0,0,.8); padding:10px 12px; border-radius:8px; color:#9f9; user-select:all; }
.tuning .tour-cards{ display:none !important; }
@media(max-width:700px){ .tour.live .tcard{ padding:16px 16px 18px; } .tour.live .tcard p{ font-size:13.5px; } }


@media(min-width:700px){
  .meta{ grid-template-columns:repeat(4,1fr); }
  .two{ grid-template-columns:1fr 1fr; gap:clamp(36px,5vw,72px); }
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important; }
  .spin3d .s3o,.spin3d svg{ animation:none !important; transform:none; }
  .spin3d svg:not(:first-child){ display:none; }
  .up{ opacity:1; transform:none; transition:none; transition-delay:0ms !important; }
  .gi:hover img,.gi:hover video,.next:hover h2{ transform:none; }
}
</style>
</head>

<header class="bar" id="bar">
  <a class="back" href="index.html#work">← All work</a>
  <a class="brand" href="index.html"><span class="spin3d"><span class="s3o"><svg><use href="#rr"/></svg><svg aria-hidden="true"><use href="#rr"/></svg><svg aria-hidden="true"><use href="#rr"/></svg><svg aria-hidden="true"><use href="#rr"/></svg><svg aria-hidden="true"><use href="#rr"/></svg></span></span><span>RankRise</span></a>
  <a class="wa-mini hv" href="https://wa.me/96170991555" target="_blank" rel="noopener">WhatsApp</a>
</header>

<main id="case"></main>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Media viewer">
  <button class="lb-x" id="lbx" aria-label="Close">×</button>
  <figure id="lbFig"></figure>
</div>

<footer>© 2026 <span style="color:var(--accent-2)">RankRise</span> Agency — Lebanon · Working worldwide</footer>

<script src="cases.js"></script>
<script>
(function(){
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const CASES=window.RANKRISE_CASES||{};
  const id=(new URLSearchParams(location.search).get('id')||'').toLowerCase();
  const c=CASES[id];
  const root=document.getElementById('case');

  if(!c){
    root.innerHTML='<section class="sec wrap" style="padding-top:22vh;text-align:center">'
      +'<span class="eyebrow">Not found</span><h1 style="font-size:clamp(30px,6vw,64px);margin-top:14px">That case isn\'t here.</h1>'
      +'<p style="color:var(--dim);margin-top:14px">Pick one from the work.</p>'
      +'<a class="btn hv" href="index.html#work">← All work</a></section>';
    return;
  }

  document.documentElement.style.setProperty('--brand', c.accent||'#7F64D0');
  document.title = c.title+' — Case Study | RankRise';
  const desc = (c.challenge||'').slice(0,155);
  const md=document.querySelector('meta[name="description"]'); if(md) md.setAttribute('content',desc);
  const canon=document.createElement('link'); canon.rel='canonical';
  canon.href='https://rankrise.media/case.html?id='+encodeURIComponent(id); document.head.appendChild(canon);
  const ld=document.createElement('script'); ld.type='application/ld+json';
  ld.textContent=JSON.stringify({'@context':'https://schema.org','@type':'CreativeWork',name:c.title+' — Case Study',
    about:c.sector,creator:{'@type':'Organization',name:'RankRise',url:'https://rankrise.media'},
    dateCreated:c.year,description:desc});
  document.head.appendChild(ld);

  // A draft case renders at its URL for review but is kept out of search.
  if(c.draft){ const r=document.createElement('meta'); r.name='robots'; r.content='noindex,nofollow'; document.head.appendChild(r); }

  const meta=[['Client',c.client],['Sector',c.sector],c.markets?['Markets',c.markets]:null,['Year',c.year],['Scope',(c.scope||[]).join(' · ')]]
    .filter(Boolean).slice(0,4);

  // Images keep their natural shape — nothing is ever cropped to fit a grid.
  // Because every item carries its real w/h, we can pack the columns ourselves
  // instead of letting the browser balance them: each tile goes to whichever
  // column is currently shortest. That leaves no empty column when a chapter
  // has fewer items than columns, and the w/h attributes reserve the right
  // space up front so nothing jumps around while the images load.
  const colCount = () => innerWidth >= 1000 ? 3 : innerWidth >= 700 ? 2 : 1;

  const tile = e => `
    <figure class="gi up hv-lift">
      ${e.video
        ? `<video data-src="${esc(e.video)}" ${e.poster?`poster="${esc(e.poster)}"`:''}${e.w?` width="${e.w}" height="${e.h}"`:''} muted loop playsinline preload="none"></video>`
        : `<img src="${esc(e.img)}" alt="${esc(e.cap||'')}"${e.w?` width="${e.w}" height="${e.h}"`:''} loading="lazy" decoding="async">`}
      ${e.cap?`<figcaption>${esc(e.cap)}</figcaption>`:''}
    </figure>`;

  const gallery = items => {
    items = items || [];
    if(!items.length) return '';
    const n = Math.min(colCount(), items.length);
    const cols = Array.from({length:n}, () => ({ h:0, html:'' }));
    items.forEach(e => {
      const c = cols.reduce((a,b) => b.h < a.h ? b : a);
      c.html += tile(e);
      c.h += (e.w && e.h ? e.h/e.w : 0.75) + (e.cap ? 0.13 : 0);   // height per unit of column width
    });
    return cols.map(c => `<div class="gcol">${c.html}</div>`).join('');
  };

  // 3D walkthrough — see tour.js. Rendered here as plain cards so the
  // stops read fine with no WebGL; tour.js upgrades them in place.
  const t = c.tour;
  const compare = s => s.before && s.after ? `
    <div class="cmp"><img src="${esc(s.after)}" alt="${esc(s.title||'')} — after" loading="lazy"><img class="cmp-b" src="${esc(s.before)}" alt="${esc(s.title||'')} — before" loading="lazy">
      <input type="range" min="0" max="100" value="50" aria-label="Before / after"><small class="l">Before</small><small class="r">After</small></div>`
    : s.compare3d ? `<label class="cmp3"><span>Before</span><input type="range" min="0" max="100" value="100" aria-label="Before / after"><span>After</span></label>` : '';
  const tourHtml = t && t.stops && t.stops.length ? `
  <section class="tour" id="tour" style="--n:${t.stops.length}" aria-label="3D walkthrough">
    <div class="wrap tour-head up"><span class="eyebrow">Walkthrough</span><h2>${esc(t.title||'Walk the room.')}</h2>
      <p class="tour-hint">Scroll to move through the space.</p>
      ${!t.model&&!t.room?'<span class="draft-note">Prototype · placeholder room</span>':''}</div>
    <div class="tour-stage"><div class="tour-pin">
      ${t.poster?`<img class="tour-poster" src="${esc(t.poster)}" alt="${esc(c.title)} — room overview" loading="lazy">`:''}
      <ol class="tour-cards">${t.stops.map((s,n)=>`
        <li class="tcard" data-i="${n}"><span class="tk">${String(n+1).padStart(2,'0')} · ${esc(s.kicker||'')}</span>
          <h3>${esc(s.title||'')}</h3>${s.text?`<p>${esc(s.text)}</p>`:''}${compare(s)}</li>`).join('')}
      </ol>
    </div></div>
  </section>` : '';
  const hasWork = (c.chapters&&c.chapters.length) || (c.execution&&c.execution.length);

  const heroMedia = c.heroVideo
    ? `<video src="${esc(c.heroVideo)}" poster="${esc(c.heroPoster||'')}" autoplay muted loop playsinline preload="metadata"></video>`
    : `<img src="${esc(c.hero)}" alt="${esc(c.title)} — case study cover" fetchpriority="high">`;

  let paint=function(){
  root.innerHTML=`
  <section class="hero">
    <div class="bgm">${heroMedia}</div>
    <div class="hero-in wrap">
      <span class="eyebrow">Case Study${c.year?' · '+esc(c.year):''}</span>
      <h1>${esc(c.tagline||c.title)}</h1>
      <p class="sub">${esc(c.title)} — ${esc(c.sector||'')}</p>
      <div class="meta">${meta.map(m=>`<div><small>${esc(m[0])}</small><b>${esc(m[1])}</b></div>`).join('')}</div>
    </div>
  </section>

  <section class="sec"><div class="wrap two">
    <div class="blk up"><span class="eyebrow">The challenge</span><h2>What was in the way.</h2><p>${esc(c.challenge)}</p></div>
    <div class="blk up"><span class="eyebrow">The approach</span><h2>How we moved.</h2><p>${esc(c.approach)}</p></div>
  </div></section>

  ${tourHtml}

  ${hasWork?`<section class="sec"${tourHtml?'':' style="padding-top:0"'}><div class="wrap">
    <div class="up"><span class="eyebrow">Execution</span><h2 style="font-size:clamp(24px,3.6vw,40px);margin-top:12px">The work.</h2>
    ${c.chapters&&c.chapters.length>1?`<nav class="chnav" aria-label="Chapters">${c.chapters.map((ch,n)=>`<a class="hv" href="#ch${n+1}"><b>${String(n+1).padStart(2,'0')}</b>${esc(ch.title||'')}</a>`).join('')}</nav>`:''}</div>
    ${c.chapters && c.chapters.length
      ? c.chapters.map((ch,n)=>`
        <div class="chap" id="ch${n+1}">
          <div class="up">
            <span class="chap-n">${String(n+1).padStart(2,'0')}</span><span class="chap-k">${esc(ch.kicker||'')}</span>
            <h3>${esc(ch.title||'')}</h3>
            ${ch.text?`<p>${esc(ch.text)}</p>`:''}
          </div>
          <div class="gal">${gallery(ch.items)}</div>
        </div>`).join('')
      : `<div class="gal">${gallery(c.execution)}</div>`}
  </div></section>`:''}

  ${c.result?`<section class="sec result"><div class="wrap up">
    <span class="eyebrow">The result</span>
    ${c.result&&c.result.stat
        ? `<div class="res-stat" style="margin-top:16px">${esc(c.result.stat)}</div><div class="res-lab">${esc(c.result.statLabel)}</div>`
        : (c.result&&c.result.pull ? `<div class="res-pull" style="margin-top:16px">${esc(c.result.pull)}</div>` : '')}
    <p class="res-text">${esc(c.result?c.result.text:'')}</p>
  </div></section>`:''}

  ${c.next&&CASES[c.next]?`<a class="next wrap" href="case.html?id=${esc(c.next)}"><small>Next case</small><h2>${esc(CASES[c.next].title)} →</h2></a>`:''}

  <section class="cta wrap">
    <h2>Ready to <span>rise?</span></h2>
    <div class="cta-row">
      <a class="btn hv" href="https://wa.me/96170991555?text=${encodeURIComponent('Hi RankRise! I saw your '+c.title+' case study and I\'d like to hear more about this kind of work.')}" target="_blank" rel="noopener">Ask about this work</a>
      <a class="btn ghost hv" href="https://wa.me/96170991555" target="_blank" rel="noopener">Start a project</a>
    </div>
  </section>`;

  // rise reveals
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ document.querySelectorAll('.up').forEach(el=>el.classList.add('in')); }
  else if('IntersectionObserver' in window){
    const io=new IntersectionObserver(en=>en.forEach(x=>{ if(!x.isIntersecting) return;
      const el=x.target, g=el.closest('.gcol');
      if(g){ const i=[...g.querySelectorAll('.up')].indexOf(el); if(i>0) el.style.setProperty('--d', Math.min(i,6)*70+'ms'); }
      el.classList.add('in'); io.unobserve(el); }),
      {threshold:.18, rootMargin:'0px 0px -6% 0px'});
    document.querySelectorAll('.up').forEach(el=>io.observe(el));
  } else { document.querySelectorAll('.up').forEach(el=>el.classList.add('in')); }

  // Gallery clips: nothing downloads until the tile is on screen, and they
  // stop the moment it leaves. The poster carries the frame until then, so
  // the page looks finished on a slow connection and costs nothing on data.
  const vids=document.querySelectorAll('.gi video');
  if(vids.length){
    if(reduce || !('IntersectionObserver' in window)){
      vids.forEach(v=>{ if(!v.src) v.src=v.dataset.src; v.setAttribute('controls',''); });
    } else {
      const vio=new IntersectionObserver(en=>en.forEach(x=>{
        const v=x.target;
        if(x.isIntersecting){ if(!v.src) v.src=v.dataset.src; v.play().catch(()=>{}); }
        else v.pause();
      }),{threshold:.25});
      vids.forEach(v=>vio.observe(v));
    }
  }
  }

  // before/after image sliders
  function wireCompares(){
    document.querySelectorAll('.cmp input').forEach(r=>r.addEventListener('input',()=>r.parentNode.style.setProperty('--x',r.value+'%')));
  }
  // The walkthrough only loads when the case has one, and never under
  // reduced motion — a scroll-driven camera is exactly what that asks to avoid.
  let tourApi=null, tourGen=0;
  function mountTour(){
    const el=document.getElementById('tour');
    if(!el || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const gen=++tourGen;
    import('./tour.js').then(m=>m.mount(el,c.tour)).then(api=>{
      if(gen!==tourGen){ api&&api.dispose(); return; }
      tourApi=api;
    }).catch(e=>console.warn('[tour]',e));
  }
  const paintBase=paint;
  paint=function(){
    tourGen++; if(tourApi){ tourApi.dispose(); tourApi=null; }
    paintBase(); wireCompares(); mountTour();
  };

  paint();

  // Column count is baked into the markup, so a rotate or a resized window
  // needs a re-pack — but only when it actually crosses a breakpoint.
  let cols = colCount();
  addEventListener('resize', () => {
    const n = colCount();
    if(n !== cols){ cols = n; paint(); }
  }, {passive:true});

  // Lightbox. A tap opens the piece at full size — and a clip that was
  // politely muted in the wall plays here with its sound and controls.
  const lb=document.getElementById('lb'), lbFig=document.getElementById('lbFig');
  let lastFocus=null;
  function lbOpen(node,cap){
    lbFig.innerHTML='';
    if(node.tagName==='VIDEO'){
      const v=document.createElement('video');
      v.src=node.src||node.dataset.src; v.poster=node.poster||'';
      v.controls=true; v.autoplay=true; v.playsInline=true; v.loop=true;
      lbFig.appendChild(v);
    } else {
      const im=document.createElement('img');
      im.src=node.src; im.alt=node.alt||'';
      lbFig.appendChild(im);
    }
    if(cap){ const fc=document.createElement('figcaption'); fc.textContent=cap; lbFig.appendChild(fc); }
    lb.classList.add('open'); document.body.style.overflow='hidden';
    lastFocus=document.activeElement; document.getElementById('lbx').focus();
  }
  function lbClose(){
    lb.classList.remove('open'); document.body.style.overflow='';
    lbFig.innerHTML='';                              // stops any playing video
    if(lastFocus) lastFocus.focus();
  }
  document.querySelectorAll('.gi').forEach(fig=>{
    fig.addEventListener('click',()=>{
      const m=fig.querySelector('img,video');
      const cap=fig.querySelector('figcaption');
      if(m) lbOpen(m,cap?cap.textContent:'');
    });
  });
  document.getElementById('lbx').addEventListener('click',lbClose);
  lb.addEventListener('click',e=>{ if(e.target===lb) lbClose(); });
  addEventListener('keydown',e=>{ if(e.key==='Escape'&&lb.classList.contains('open')) lbClose(); });

  addEventListener('scroll',()=>document.getElementById('bar').classList.toggle('solid',scrollY>60),{passive:true});
})();
</script>
</body>
</html>

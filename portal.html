<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RankRise · Client Portal — بوابة الزباين</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#7062F0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --ink:#0e0e13; --ink-2:#42424e; --muted:#8b8b97;
  --line:#e7e7ec; --surface:#f6f6f9; --surface-2:#efeff3;
  --accent:#7062f0; --accent-2:#574ae0; --accent-soft:#efedfd;
  --dark:#0e0e13; --on-dark:#f4f4f7;
  --ok:#1f9d63; --ok-soft:#e5f5ec; --warn:#c9820a; --warn-soft:#fbf1dd;
  --bad:#d5485b; --bad-soft:#fbe7ea; --info:#3b6fd4; --info-soft:#e7eefb;
  --r:16px; --r-sm:11px; --shadow:0 18px 50px -20px rgba(14,14,19,.28);
  --shadow-sm:0 6px 20px -12px rgba(14,14,19,.35);
}
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; }
body{
  background:var(--surface); color:var(--ink);
  font-family:'DM Sans','Tajawal',system-ui,sans-serif;
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
html[dir=rtl] body{ font-family:'Tajawal','DM Sans',system-ui,sans-serif; }
h1,h2,h3,h4{ font-family:'Syne',sans-serif; font-weight:800; line-height:1.05; letter-spacing:-.02em; }
html[dir=rtl] h1,html[dir=rtl] h2,html[dir=rtl] h3,html[dir=rtl] h4{ font-family:'Tajawal',sans-serif; font-weight:800; letter-spacing:0; }
button,input,textarea,select{ font:inherit; color:inherit; }
button{ cursor:pointer; background:none; border:none; }
a{ color:inherit; text-decoration:none; }
::selection{ background:var(--accent); color:#fff; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

/* buttons */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px;
  font-weight:600; font-size:14px; padding:11px 20px; border-radius:100px;
  border:1px solid transparent; transition:transform .15s, background .2s, color .2s, border-color .2s; white-space:nowrap; }
.btn:active{ transform:scale(.97); }
.btn-p{ background:var(--accent); color:#fff; } .btn-p:hover{ background:var(--accent-2); }
.btn-d{ background:var(--ink); color:#fff; } .btn-d:hover{ background:var(--accent); }
.btn-o{ background:#fff; color:var(--ink); border-color:var(--line); } .btn-o:hover{ border-color:var(--ink); }
.btn-ok{ background:var(--ok); color:#fff; } .btn-ok:hover{ filter:brightness(1.06); }
.btn-sm{ padding:8px 14px; font-size:13px; }
.btn-block{ width:100%; }
.btn[disabled]{ opacity:.5; cursor:not-allowed; }

/* badges */
.badge{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700;
  letter-spacing:.02em; padding:5px 11px; border-radius:100px; white-space:nowrap; }
.b-pending{ background:var(--warn-soft); color:var(--warn); }
.b-approved{ background:var(--ok-soft); color:var(--ok); }
.b-changes{ background:var(--bad-soft); color:var(--bad); }
.b-scheduled{ background:var(--info-soft); color:var(--info); }
.b-published{ background:var(--accent-soft); color:var(--accent-2); }
.dot{ width:7px; height:7px; border-radius:100px; background:currentColor; }

.hide{ display:none !important; }

/* ══════════ LOGIN ══════════ */
.login{ min-height:100dvh; display:grid; place-items:center; padding:24px;
  background:radial-gradient(120% 90% at 50% -10%, #efedfd 0%, var(--surface) 55%); }
.login-card{ width:100%; max-width:440px; background:#fff; border:1px solid var(--line);
  border-radius:24px; box-shadow:var(--shadow); padding:clamp(26px,5vw,40px); }
.login .logo{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
.login .logo b{ font-family:'Syne'; font-weight:800; font-size:22px; letter-spacing:-.02em; }
.rocket{ width:34px; height:34px; border-radius:11px; background:var(--ink); color:#fff;
  display:grid; place-items:center; font-size:17px; }
.login h1{ font-size:clamp(24px,5vw,30px); margin:14px 0 6px; }
.login p.sub{ color:var(--ink-2); margin-bottom:22px; }
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-2); margin-bottom:7px; letter-spacing:.02em; }
.field select,.field input,.field textarea{ width:100%; border:1px solid var(--line); background:var(--surface);
  border-radius:12px; padding:13px 15px; font-size:15px; transition:border-color .2s, background .2s; }
.field select:focus,.field input:focus,.field textarea:focus{ outline:none; border-color:var(--accent); background:#fff; }
.login .hint{ font-size:12.5px; color:var(--muted); margin-top:16px; text-align:center; line-height:1.7; }
.seg{ display:flex; gap:6px; background:var(--surface-2); padding:5px; border-radius:100px; margin-bottom:20px; }
.seg button{ flex:1; padding:9px; border-radius:100px; font-size:13.5px; font-weight:600; color:var(--ink-2); transition:.2s; }
.seg button.on{ background:#fff; color:var(--ink); box-shadow:var(--shadow-sm); }

/* ══════════ APP SHELL ══════════ */
.app{ min-height:100dvh; display:flex; flex-direction:column; }
.topbar{ position:sticky; top:0; z-index:40; background:rgba(255,255,255,.9);
  backdrop-filter:saturate(180%) blur(14px); border-bottom:1px solid var(--line); }
.topbar-in{ max-width:1200px; margin:0 auto; padding:12px clamp(14px,3vw,26px);
  display:flex; align-items:center; gap:14px; }
.tb-brand{ display:flex; align-items:center; gap:10px; }
.tb-brand .rocket{ width:30px; height:30px; border-radius:9px; font-size:15px; }
.tb-brand b{ font-family:'Syne'; font-weight:800; font-size:17px; }
html[dir=rtl] .tb-brand b{ font-family:'Tajawal'; }
.tb-brand small{ display:block; font-size:11px; color:var(--muted); font-weight:600; margin-top:-2px; }
.tb-spacer{ flex:1; }
.icon-btn{ width:42px; height:42px; border-radius:12px; border:1px solid var(--line); background:#fff;
  display:inline-grid; place-items:center; position:relative; transition:.2s; font-size:18px; }
.icon-btn:hover{ border-color:var(--ink); }
.icon-btn .count{ position:absolute; top:-6px; inset-inline-end:-6px; min-width:19px; height:19px; padding:0 5px;
  background:var(--bad); color:#fff; border-radius:100px; font-size:11px; font-weight:700;
  display:grid; place-items:center; border:2px solid #fff; }
.avatar{ width:38px; height:38px; border-radius:100px; display:grid; place-items:center;
  color:#fff; font-weight:700; font-size:14px; font-family:'Syne'; flex-shrink:0; }
.tb-profile{ display:flex; align-items:center; gap:9px; border:1px solid var(--line); background:#fff;
  border-radius:100px; padding:4px 4px; transition:.2s; }
.tb-profile:hover{ border-color:var(--ink); }
.tb-profile .nm{ font-size:13.5px; font-weight:600; padding-inline:4px; }

.layout{ flex:1; max-width:1200px; width:100%; margin:0 auto; padding:clamp(16px,3vw,28px);
  display:grid; grid-template-columns:220px 1fr; gap:clamp(16px,3vw,28px); align-items:start; }
.side{ position:sticky; top:80px; display:flex; flex-direction:column; gap:4px; }
.nav-link{ display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:12px;
  font-size:14.5px; font-weight:600; color:var(--ink-2); transition:.15s; }
.nav-link .ic{ font-size:18px; width:22px; text-align:center; }
.nav-link:hover{ background:var(--surface-2); color:var(--ink); }
.nav-link.on{ background:var(--ink); color:#fff; }
.nav-link .pill{ margin-inline-start:auto; background:var(--accent); color:#fff; font-size:11px;
  font-weight:700; padding:1px 8px; border-radius:100px; }
.nav-link.on .pill{ background:#fff; color:var(--ink); }
.side-hr{ height:1px; background:var(--line); margin:8px 4px; }
.main{ min-width:0; }

/* page head */
.ph{ margin-bottom:22px; }
.ph h1{ font-size:clamp(24px,4vw,34px); }
.ph p{ color:var(--ink-2); margin-top:6px; max-width:60ch; }
.eyebrow{ display:inline-flex; align-items:center; gap:9px; font-size:11.5px; font-weight:700;
  letter-spacing:.16em; text-transform:uppercase; color:var(--accent); margin-bottom:10px; }
.eyebrow::before{ content:""; width:20px; height:1px; background:var(--accent); }

/* cards / grid */
.card{ background:#fff; border:1px solid var(--line); border-radius:var(--r); }
.grid{ display:grid; gap:16px; }
.stat-grid{ grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
.stat{ padding:18px; }
.stat .k{ font-size:11.5px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); }
.stat .v{ font-family:'Syne'; font-weight:800; font-size:clamp(26px,4vw,34px); margin-top:6px; letter-spacing:-.02em; }
html[dir=rtl] .stat .v{ font-family:'Tajawal'; }
.stat .sub{ font-size:12.5px; color:var(--ink-2); margin-top:2px; }

/* plan card */
.plan{ padding:22px; background:var(--dark); color:var(--on-dark); border-color:transparent; }
.plan .eyebrow{ color:#a99bf7; } .plan .eyebrow::before{ background:#a99bf7; }
.plan h3{ color:#fff; font-size:22px; margin-bottom:4px; }
.plan .pkg{ color:rgba(244,244,247,.7); font-size:13.5px; }
.plan .prog{ height:9px; background:rgba(255,255,255,.14); border-radius:100px; overflow:hidden; margin:16px 0 8px; }
.plan .prog i{ display:block; height:100%; background:linear-gradient(90deg,#7062f0,#a99bf7); border-radius:100px; }
.plan .deliv{ display:grid; gap:9px; margin-top:14px; }
.plan .deliv .row{ display:flex; align-items:center; gap:10px; font-size:13.5px; color:rgba(244,244,247,.85); }
.plan .deliv .row .n{ margin-inline-start:auto; font-weight:700; color:#fff; }
.chk{ width:18px; height:18px; border-radius:6px; background:rgba(255,255,255,.12); display:grid; place-items:center; font-size:11px; flex-shrink:0; }
.chk.done{ background:var(--accent); color:#fff; }

/* content item */
.items{ display:grid; gap:14px; }
.item{ display:grid; grid-template-columns:96px 1fr; gap:16px; padding:14px; align-items:stretch; }
.thumb{ border-radius:12px; aspect-ratio:1; display:grid; place-items:center; color:#fff;
  font-family:'Syne'; font-weight:800; font-size:26px; position:relative; overflow:hidden; }
.thumb .pf{ position:absolute; bottom:7px; inset-inline-end:7px; font-family:'DM Sans'; font-size:15px; }
.item-body{ min-width:0; display:flex; flex-direction:column; }
.item-top{ display:flex; align-items:flex-start; gap:10px; flex-wrap:wrap; }
.item-top h3{ font-size:17px; letter-spacing:-.01em; }
.item .meta{ font-size:12.5px; color:var(--muted); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap; }
.item .cap{ font-size:13.5px; color:var(--ink-2); margin-top:9px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.item-actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:auto; padding-top:12px; }
.item-actions .spacer{ flex:1; }
.mini{ display:inline-flex; align-items:center; gap:5px; font-size:12.5px; color:var(--muted); font-weight:600; }

/* filters */
.filters{ display:flex; gap:7px; flex-wrap:wrap; margin-bottom:16px; }
.filter{ font-size:13px; font-weight:600; color:var(--ink-2); background:#fff; border:1px solid var(--line);
  padding:8px 14px; border-radius:100px; transition:.2s; }
.filter:hover{ border-color:var(--ink); }
.filter.on{ background:var(--ink); color:#fff; border-color:var(--ink); }

/* calendar / timeline */
.tl-day{ margin-bottom:22px; }
.tl-date{ display:flex; align-items:baseline; gap:10px; margin-bottom:12px; }
.tl-date b{ font-family:'Syne'; font-size:16px; } html[dir=rtl] .tl-date b{ font-family:'Tajawal'; }
.tl-date span{ font-size:12.5px; color:var(--muted); }
.tl-item{ display:flex; align-items:center; gap:12px; padding:12px 14px; margin-bottom:8px; }
.tl-time{ font-family:'Syne'; font-weight:700; font-size:13px; color:var(--accent-2); width:64px; flex-shrink:0; }
html[dir=rtl] .tl-time{ font-family:'Tajawal'; }

/* ranking */
.rank{ display:flex; align-items:center; gap:14px; padding:14px; }
.rank .pos{ font-family:'Syne'; font-weight:800; font-size:20px; width:38px; text-align:center; color:var(--muted); flex-shrink:0; }
.rank.top1 .pos,.rank.top2 .pos,.rank.top3 .pos{ font-size:24px; }
.rank.top1 .pos{ color:#e0a500; } .rank.top2 .pos{ color:#9aa0ab; } .rank.top3 .pos{ color:#c8794a; }
.rank .score{ margin-inline-start:auto; text-align:center; flex-shrink:0; }
.rank .score b{ font-family:'Syne'; font-size:20px; display:block; } html[dir=rtl] .rank .score b{ font-family:'Tajawal'; }
.rank .score span{ font-size:11px; color:var(--muted); }

/* community vote */
.vote{ padding:16px; display:flex; gap:14px; }
.vbtns{ display:flex; flex-direction:column; align-items:center; gap:4px; flex-shrink:0; }
.vbtn{ width:38px; height:34px; border-radius:10px; border:1px solid var(--line); display:grid; place-items:center; font-size:16px; transition:.15s; }
.vbtn:hover{ border-color:var(--ink); }
.vbtn.up.on{ background:var(--ok-soft); border-color:var(--ok); color:var(--ok); }
.vbtn.down.on{ background:var(--bad-soft); border-color:var(--bad); color:var(--bad); }
.vscore{ font-family:'Syne'; font-weight:800; font-size:16px; } html[dir=rtl] .vscore{ font-family:'Tajawal'; }
.vote .who{ font-size:12px; color:var(--muted); margin-top:8px; }

/* comments / messages */
.thread{ display:flex; flex-direction:column; gap:12px; }
.msg{ display:flex; gap:10px; }
.msg .avatar{ width:34px; height:34px; font-size:12px; }
.bubble{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:10px 13px; max-width:78%; }
.msg.me{ flex-direction:row-reverse; }
.msg.me .bubble{ background:var(--accent-soft); border-color:transparent; }
.bubble .nm{ font-size:12px; font-weight:700; color:var(--accent-2); margin-bottom:2px; }
.bubble .tx{ font-size:14px; }
.bubble .tm{ font-size:10.5px; color:var(--muted); margin-top:4px; }
.composer{ display:flex; gap:8px; margin-top:14px; align-items:flex-end; }
.composer textarea{ flex:1; border:1px solid var(--line); border-radius:14px; padding:11px 14px;
  resize:none; max-height:120px; background:var(--surface); }
.composer textarea:focus{ outline:none; border-color:var(--accent); background:#fff; }

/* notifications panel */
.notif-panel{ position:fixed; inset-block:0; inset-inline-end:0; width:min(400px,100vw); z-index:60;
  background:#fff; box-shadow:var(--shadow); transform:translateX(100%); transition:transform .3s cubic-bezier(.6,0,.2,1);
  display:flex; flex-direction:column; }
html[dir=rtl] .notif-panel{ transform:translateX(-100%); }
.notif-panel.open{ transform:translateX(0); }
.notif-head{ display:flex; align-items:center; gap:12px; padding:16px 18px; border-bottom:1px solid var(--line); }
.notif-head h3{ font-size:17px; }
.notif-list{ flex:1; overflow-y:auto; }
.notif{ display:flex; gap:12px; padding:14px 18px; border-bottom:1px solid var(--line); transition:.15s; }
.notif.unread{ background:var(--accent-soft); }
.notif .nic{ width:36px; height:36px; border-radius:10px; display:grid; place-items:center; font-size:16px; flex-shrink:0; background:var(--surface-2); }
.notif .ntx{ font-size:13.5px; } .notif .ntx b{ font-weight:700; }
.notif .ntm{ font-size:11px; color:var(--muted); margin-top:3px; }
.scrim{ position:fixed; inset:0; background:rgba(14,14,19,.4); z-index:55; opacity:0; pointer-events:none; transition:.3s; }
.scrim.on{ opacity:1; pointer-events:auto; }

/* modal */
.modal-scrim{ position:fixed; inset:0; background:rgba(14,14,19,.5); z-index:70; display:grid; place-items:center;
  padding:16px; opacity:0; pointer-events:none; transition:.2s; }
.modal-scrim.on{ opacity:1; pointer-events:auto; }
.modal{ background:#fff; border-radius:20px; width:100%; max-width:560px; max-height:90dvh; overflow-y:auto;
  box-shadow:var(--shadow); transform:translateY(12px); transition:.25s; }
.modal-scrim.on .modal{ transform:translateY(0); }
.modal-head{ position:sticky; top:0; background:#fff; display:flex; align-items:center; gap:12px;
  padding:18px 20px; border-bottom:1px solid var(--line); z-index:2; }
.modal-head h2{ font-size:19px; } .modal-body{ padding:20px; }
.modal-x{ margin-inline-start:auto; width:36px; height:36px; border-radius:10px; border:1px solid var(--line);
  display:grid; place-items:center; font-size:18px; }

/* empty */
.empty{ text-align:center; padding:48px 20px; color:var(--muted); }
.empty .em-ic{ font-size:34px; margin-bottom:10px; }

/* toast */
.toast{ position:fixed; inset-block-end:calc(env(safe-area-inset-bottom) + 84px); inset-inline:0; z-index:90;
  display:flex; justify-content:center; pointer-events:none; }
.toast .t{ background:var(--ink); color:#fff; padding:12px 20px; border-radius:100px; font-size:14px; font-weight:600;
  box-shadow:var(--shadow); transform:translateY(20px); opacity:0; transition:.3s; }
.toast .t.on{ transform:translateY(0); opacity:1; }

/* section title */
.stitle{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin:26px 0 14px; }
.stitle h2{ font-size:19px; }
.stitle a{ font-size:13px; font-weight:600; color:var(--accent); }

/* mobile bottom nav */
.mobnav{ display:none; }

@media(max-width:860px){
  .layout{ grid-template-columns:1fr; padding-bottom:90px; }
  .side{ display:none; }
  .mobnav{ display:flex; position:fixed; inset-block-end:0; inset-inline:0; z-index:40; background:#fff;
    border-top:1px solid var(--line); padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    justify-content:space-around; }
  .mobnav a{ display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; font-weight:600;
    color:var(--muted); padding:5px 8px; border-radius:10px; position:relative; }
  .mobnav a .ic{ font-size:20px; } .mobnav a.on{ color:var(--accent); }
  .mobnav a .pill{ position:absolute; top:0; inset-inline-end:6px; background:var(--accent); color:#fff;
    font-size:9px; min-width:15px; height:15px; border-radius:100px; display:grid; place-items:center; }
  .tb-profile .nm{ display:none; }
  .item{ grid-template-columns:72px 1fr; }
}
</style>
</head>
<body>

<!-- ══════════════════ LOGIN ══════════════════ -->
<div id="login" class="login">
  <div class="login-card">
    <div class="logo"><span class="rocket">🚀</span><b>RankRise</b></div>
    <h1 data-i="loginTitle">بوابة الزباين</h1>
    <p class="sub" data-i="loginSub">شوف خطتك، وافق على المحتوى، وتابع كل شي — بمكان واحد.</p>

    <div class="seg" id="roleSeg">
      <button class="on" data-role="client" data-i="asClient">أنا زبون</button>
      <button data-role="studio" data-i="asStudio">فريق RankRise</button>
    </div>

    <div class="field" id="clientPick">
      <label data-i="pickBrand">اختر علامتك التجارية</label>
      <select id="brandSelect"></select>
    </div>

    <div class="field">
      <label data-i="passcode">رمز الدخول</label>
      <input id="passcode" type="text" inputmode="numeric" placeholder="1234" autocomplete="off">
    </div>

    <button class="btn btn-d btn-block" id="loginBtn" data-i="enter">دخول</button>
    <p class="hint" data-i="demoHint">نسخة تجريبية · رمز الدخول <b>1234</b> · البيانات محفوظة على جهازك فقط</p>
    <p class="hint"><button id="langToggle" style="color:var(--accent);font-weight:700">English ⇄ عربي</button></p>
  </div>
</div>

<!-- ══════════════════ APP ══════════════════ -->
<div id="app" class="app hide">
  <header class="topbar">
    <div class="topbar-in">
      <div class="tb-brand">
        <span class="rocket">🚀</span>
        <div><b>RankRise</b><small data-i="portalTag">Client Portal</small></div>
      </div>
      <div class="tb-spacer"></div>
      <button class="icon-btn" id="langBtn" title="Language">🌐</button>
      <button class="icon-btn" id="bellBtn" title="Notifications">🔔<span class="count hide" id="bellCount">0</span></button>
      <button class="tb-profile" id="profileBtn">
        <span class="avatar" id="tbAvatar">R</span>
        <span class="nm" id="tbName">—</span>
      </button>
    </div>
  </header>

  <div class="layout">
    <aside class="side" id="side"></aside>
    <main class="main" id="view"></main>
  </div>

  <nav class="mobnav" id="mobnav"></nav>
</div>

<!-- notifications -->

/* ---------- seed ---------- */

/* ---------- store ---------- */
let DB=load();
function load(){ try{const r=JSON.parse(localStorage.getItem(KEY)); if(r&&r.clients) return r;}catch(e){} const s=seed(); localStorage.setItem(KEY,JSON.stringify(s)); return s; }
function save(){ localStorage.setItem(KEY,JSON.stringify(DB)); }

/* ---------- session ---------- */
let ME=null; // {role:'client'|'studio', id}
function me(){ return DB.clients.find(c=>c.id===ME?.id); }
function isStudio(){ return ME?.role==='studio'; }

/* ---------- helpers ---------- */
function avatarColor(id){ let h=0; for(const ch of id) h=(h*31+ch.charCodeAt(0))>>>0; return AVCOL[h%AVCOL.length]; }
function initials(name){ return name.split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function clientName(id){ return DB.clients.find(c=>c.id===id)?.name||id; }
function fmtDate(ts){ const d=new Date(ts); return d.toLocaleDateString(LANG==='ar'?'ar-EG':'en-GB',{day:'numeric',month:'short'}); }
function fmtDay(ts){ const d=new Date(ts); return d.toLocaleDateString(LANG==='ar'?'ar-EG':'en-GB',{weekday:'long',day:'numeric',month:'long'}); }
function fmtTime(ts){ const d=new Date(ts); return d.toLocaleTimeString(LANG==='ar'?'ar-EG':'en-GB',{hour:'2-digit',minute:'2-digit'}); }
function ago(ts){ const s=(Date.now()-ts)/1000; if(s<60)return LANG==='ar'?'الآن':'now'; if(s<3600)return Math.floor(s/60)+(LANG==='ar'?' د':'m'); if(s<86400)return Math.floor(s/3600)+(LANG==='ar'?' س':'h'); return Math.floor(s/86400)+(LANG==='ar'?' ي':'d'); }
function score(it){ return it.likes + it.votes*5 + it.comments.length*2; }
function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.add('on'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('on'),1800); }
function notify(clientId,ic,tx){ DB.notifs.unshift({id:'n'+Date.now()+Math.floor(Math.random()*999),client:clientId,ic,tx,ts:Date.now(),read:false}); save(); }
function myNotifs(){ return DB.notifs.filter(n=> isStudio() ? true : n.client===ME.id); }
function unread(){ return myNotifs().filter(n=>!n.read).length; }

const STATUS_BADGE={pending:['b-pending','f_pending'],approved:['b-approved','f_approved'],changes:['b-changes','f_changes'],scheduled:['b-scheduled','f_scheduled'],published:['b-published','f_published']};

/* ═══════════ LOGIN ═══════════ */
function initLogin(){
  applyLang();
  const sel=$('#brandSelect'); sel.innerHTML=DB.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  $$('#roleSeg button').forEach(b=>b.onclick=()=>{
    $$('#roleSeg button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    $('#clientPick').classList.toggle('hide', b.dataset.role==='studio');
  });
  $('#loginBtn').onclick=()=>{
    if($('#passcode').value.trim()!=='1234'){ toast(LANG==='ar'?'رمز الدخول غلط':'Wrong passcode'); return; }
    const role=$('#roleSeg .on').dataset.role;
    ME = role==='studio' ? {role:'studio',id:DB.clients[0].id} : {role:'client',id:sel.value};
    localStorage.setItem('rr_me',JSON.stringify(ME));
    enterApp();
  };
  $('#langToggle').onclick=()=>{ LANG=LANG==='ar'?'en':'ar'; localStorage.setItem('rr_lang',LANG); applyLang(); };
}
function applyLang(){
  document.documentElement.lang=LANG; document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
  $$('[data-i]').forEach(el=>{ const k=el.dataset.i; if(I18N[LANG][k]!==undefined) el.innerHTML=I18N[LANG][k]; });
}

/* ═══════════ APP ═══════════ */
let VIEW='overview';
const NAV=[
  ['overview','🏠','nav_overview'],['content','📋','nav_content'],['calendar','🗓️','nav_calendar'],
  ['ranking','🏆','nav_ranking'],['community','🗳️','nav_community'],['messages','💬','nav_messages'],
];
function enterApp(){
  $('#login').classList.add('hide'); $('#app').classList.remove('hide');
  applyLang(); renderChrome(); go(VIEW);
  $('#bellBtn').onclick=openNotifs; $('#notifClose').onclick=closeNotifs; $('#scrim').onclick=closeNotifs;
  $('#markAll').onclick=()=>{ myNotifs().forEach(n=>n.read=true); save(); renderNotifs(); updateBell(); };
  $('#langBtn').onclick=()=>{ LANG=LANG==='ar'?'en':'ar'; localStorage.setItem('rr_lang',LANG); applyLang(); renderChrome(); go(VIEW); };
  $('#profileBtn').onclick=profileMenu;
}
function renderChrome(){
  const nav=[...NAV]; if(isStudio()) nav.push(['studio','✏️','nav_studio']);
  const c=me();
  $('#tbAvatar').style.background=avatarColor(c.id); $('#tbAvatar').textContent=isStudio()?'RR':initials(c.name);
  $('#tbName').textContent=isStudio()?'RankRise':c.name;
  const pending=DB.content.filter(x=>(isStudio()||x.client===ME.id)&&x.status==='pending').length;
  $('#side').innerHTML=nav.map(([id,ic,lbl])=>{
    const pill=id==='content'&&pending?`<span class="pill">${pending}</span>`:'';
    return `<a class="nav-link ${id===VIEW?'on':''}" data-go="${id}"><span class="ic">${ic}</span><span>${t(lbl)}</span>${pill}</a>`;
  }).join('') + `<div class="side-hr"></div>` +
     `<a class="nav-link" id="logoutLink"><span class="ic">↩︎</span><span>${t('logout')}</span></a>`;
  $('#mobnav').innerHTML=nav.slice(0,5).map(([id,ic,lbl])=>{
    const pill=id==='content'&&pending?`<span class="pill">${pending}</span>`:'';
    return `<a class="${id===VIEW?'on':''}" data-go="${id}"><span class="ic">${ic}</span>${t(lbl)}${pill}</a>`;
  }).join('');
  $$('[data-go]').forEach(a=>a.onclick=()=>go(a.dataset.go));
  $('#logoutLink').onclick=logout;
  updateBell();
}
function go(v){ VIEW=v; renderChrome(); const r=RENDER[v]; $('#view').innerHTML=r?r():''; if(AFTER[v])AFTER[v](); window.scrollTo(0,0); }
function updateBell(){ const n=unread(); const el=$('#bellCount'); el.textContent=n; el.classList.toggle('hide',!n); }

/* ---------- VIEWS ---------- */
const RENDER={};
const AFTER={};

/* Overview */
RENDER.overview=()=>{
  const c=me(); const scope=x=>isStudio()||x.client===ME.id;
  const mine=DB.content.filter(scope);
  const pending=mine.filter(x=>x.status==='pending');
  const scheduled=mine.filter(x=>x.status==='scheduled').length;
  const published=mine.filter(x=>x.status==='published');
  const engage=published.reduce((a,x)=>a+x.likes,0);
  const deliv=[
    ['Reels / videos', mine.filter(x=>x.type==='Reel').length],
    ['Posts & carousels', mine.filter(x=>x.type==='Post'||x.type==='Carousel').length],
    ['Approved', mine.filter(x=>x.status==='approved'||x.status==='scheduled'||x.status==='published').length],
  ];
  return `
  <div class="ph"><div class="eyebrow">${isStudio()?t('studioNote'):t('portalTag')}</div>
    <h1>${t('hi')}, ${esc(isStudio()?'RankRise':c.name.split(' ')[0])} 👋</h1>
    <p>${t('welcomeSub')}</p></div>

  <div class="grid" style="grid-template-columns:1.2fr 1fr;align-items:start">

      <div class="card stat"><div class="k">${t('st_pending')}</div><div class="v">${pending.length}</div><div class="sub">${t('nav_content')}</div></div>
      <div class="card stat"><div class="k">${t('st_scheduled')}</div><div class="v">${scheduled}</div><div class="sub">${t('nav_calendar')}</div></div>
      <div class="card stat"><div class="k">${t('st_published')}</div><div class="v">${published.length}</div><div class="sub">${t('thisMonth')}</div></div>
      <div class="card stat"><div class="k">${t('st_engage')}</div><div class="v">${engage.toLocaleString()}</div><div class="sub">${t('likes')}</div></div>
    </div>
    <div class="card plan">
      <div class="eyebrow">${t('yourPlan')}</div>
      <h3>${esc(c.pkg.split('·')[0].trim())}</h3>
      <div class="pkg">${t('pkgLabel')}: ${esc(c.pkg)}</div>
      <div class="prog"><i style="width:${c.prog}%"></i></div>
      <div class="pkg">${c.prog}% ${t('thisMonth')}</div>
      <div class="deliv">${deliv.map(([l,n])=>`<div class="row"><span class="chk done">✓</span>${esc(l)}<span class="n">${n}</span></div>`).join('')}</div>
    </div>
  </div>

  <div class="stitle"><h2>${t('pendingTitle')}</h2><a data-go="content">${t('seeAll')}</a></div>
  <div class="items" id="ovPending">${pending.length?pending.map(itemCard).join(''):emptyBox(t('noItems'))}</div>`;
};
AFTER.overview=()=>{ bindItems(); $$('[data-go]').forEach(a=>a.onclick=()=>go(a.dataset.go)); };

/* Content / Plan */
let CFILTER='all';
RENDER.content=()=>{
  const filters=['all','pending','approved','changes','scheduled','published'];
  return `
  <div class="ph"><div class="eyebrow">${t('nav_content')}</div><h1>${t('contentTitle')}</h1><p>${t('contentSub')}</p></div>
  <div class="filters">${filters.map(f=>`<button class="filter ${f===CFILTER?'on':''}" data-f="${f}">${t('f_'+f)}</button>`).join('')}</div>
  <div class="items" id="cItems"></div>`;
};
AFTER.content=()=>{
  $$('[data-f]').forEach(b=>b.onclick=()=>{ CFILTER=b.dataset.f; drawContent(); });
  drawContent();
};
function drawContent(){
  $$('#view [data-f]').forEach(b=>b.classList.toggle('on',b.dataset.f===CFILTER));
  const list=DB.content.filter(x=>(isStudio()||x.client===ME.id)&&(CFILTER==='all'||x.status===CFILTER));
  $('#cItems').innerHTML=list.length?list.map(itemCard).join(''):emptyBox(t('noItems'));
  bindItems();
}
function itemCard(it){
  const [cls,lbl]=STATUS_BADGE[it.status];
  const col=avatarColor(it.client);
  return `<div class="card item" data-id="${it.id}">
    <div class="thumb" style="background:linear-gradient(135deg,${col},${col}aa)">${esc(it.type[0])}<span class="pf">${platIcon(it.platform)}</span></div>
    <div class="item-body">
      <div class="item-top">
        <div style="flex:1;min-width:0"><h3>${esc(it.title)}</h3>
          <div class="meta"><span>${esc(it.type)} · ${esc(it.platform)}</span>${isStudio()?`<span>• ${esc(clientName(it.client))}</span>`:''}<span>• ${fmtDate(it.scheduledFor)}</span></div>
        </div>
        <span class="badge ${cls}"><span class="dot"></span>${t(lbl)}</span>
      </div>
      <div class="cap">${esc(it.caption)}</div>
      <div class="item-actions">
        ${it.status==='pending'&&!isStudio()
          ? `<button class="btn btn-ok btn-sm" data-act="approve" data-id="${it.id}">${t('approve')}</button>
             <button class="btn btn-o btn-sm" data-act="changes" data-id="${it.id}">${t('reqChanges')}</button>`
          : `<span class="badge ${cls}"><span class="dot"></span>${t(lbl)}</span>`}
        <button class="btn btn-o btn-sm" data-act="open" data-id="${it.id}">${t('open_detail')}</button>
        <span class="spacer"></span>
        <span class="mini">💬 ${it.comments.length}</span>
        <span class="mini">🗳️ ${it.votes}</span>
        ${it.likes?`<span class="mini">❤️ ${it.likes}</span>`:''}
      </div>
    </div></div>`;
}
function platIcon(p){ return {Instagram:'📸',TikTok:'🎵',LinkedIn:'💼',Facebook:'👍',YouTube:'▶️'}[p]||'🌐'; }
function bindItems(){
  $$('[data-act]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); const it=DB.content.find(x=>x.id===b.dataset.id);
    if(b.dataset.act==='approve') approve(it);
    else if(b.dataset.act==='changes') reqChanges(it);
    else openItem(it);
  });
  $$('.item[data-id]').forEach(c=>c.onclick=()=>openItem(DB.content.find(x=>x.id===c.dataset.id)));
}
function approve(it){ it.status='approved'; save(); notify(it.client,'✅',`«${it.title}» — تمت الموافقة`); toast(t('approvedToast')); refresh(); }
function reqChanges(it){ modalPrompt(t('reqChanges'),t('reqCh_prompt'),txt=>{ if(!txt)return;
  it.status='changes'; it.comments.push({from:'client',nm:isStudio()?'RankRise':me().name,tx:txt,ts:Date.now()});
  save(); notify(it.client,'✏️',`طلب تعديل على «${it.title}»`); toast(t('changesAsked')); closeModal(); refresh(); }); }

/* item detail modal */
function openItem(it){
  const [cls,lbl]=STATUS_BADGE[it.status]; const col=avatarColor(it.client);
  $('#modal').innerHTML=`
    <div class="modal-head"><h2>${esc(it.title)}</h2><button class="modal-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="thumb" style="height:150px;aspect-ratio:auto;background:linear-gradient(135deg,${col},${col}aa);font-size:40px">${esc(it.type[0])}<span class="pf" style="font-size:22px">${platIcon(it.platform)}</span></div>
      <div class="item-top" style="margin-top:14px">
        <div class="meta" style="font-size:13px">${esc(it.type)} · ${esc(it.platform)} · ${esc(clientName(it.client))} · ${fmtDate(it.scheduledFor)}</div>
        <span class="badge ${cls}" style="margin-inline-start:auto"><span class="dot"></span>${t(lbl)}</span>
      </div>
      <p style="margin:14px 0;font-size:15px;line-height:1.7">${esc(it.caption)}</p>
      ${it.status==='pending'&&!isStudio()?`<div style="display:flex;gap:8px;margin-bottom:16px">
        <button class="btn btn-ok" onclick="approve(DB.content.find(x=>x.id==='${it.id}'));closeModal()">${t('approve')}</button>
        <button class="btn btn-o" onclick="reqChanges(DB.content.find(x=>x.id==='${it.id}'))">${t('reqChanges')}</button></div>`:''}
      <div class="side-hr" style="margin:16px 0"></div>
      <h3 style="font-size:15px;margin-bottom:12px">💬 ${t('nav_messages')}</h3>
      <div class="thread" id="itThread">${it.comments.map(cmt).join('')||`<p style="color:var(--muted);font-size:13px">${t('noItems')}</p>`}</div>
      <div class="composer"><textarea id="itMsg" rows="1" placeholder="${t('typeMsg')}"></textarea><button class="btn btn-p btn-sm" id="itSend">${t('send')}</button></div>
    </div>`;
  openModal();
  $('#itSend').onclick=()=>{ const v=$('#itMsg').value.trim(); if(!v)return;
    it.comments.push({from:isStudio()?'team':'client',nm:isStudio()?'RankRise':me().name,tx:v,ts:Date.now()});
    save(); notify(it.client,'💬',`تعليق جديد على «${it.title}»`); toast(t('commentAdded'));
    $('#itThread').innerHTML=it.comments.map(cmt).join(''); $('#itMsg').value=''; updateBell();
  };
}
function cmt(m){ const mine=(m.from==='client'&&!isStudio())||(m.from==='team'&&isStudio());
  return `<div class="msg ${mine?'me':''}"><span class="avatar" style="background:${m.from==='team'?'#0e0e13':'#7062f0'}">${m.from==='team'?'RR':initials(m.nm)}</span>
    <div class="bubble"><div class="nm">${esc(m.nm)}</div><div class="tx">${esc(m.tx)}</div><div class="tm">${ago(m.ts)}</div></div></div>`; }

/* Calendar */
RENDER.calendar=()=>{
  const list=DB.content.filter(x=>(isStudio()||x.client===ME.id)&&['scheduled','approved','pending'].includes(x.status))
    .sort((a,b)=>a.scheduledFor-b.scheduledFor);
  const groups={};
  list.forEach(it=>{ const k=new Date(it.scheduledFor).toDateString(); (groups[k]??=[]).push(it); });
  const days=Object.keys(groups);
  return `<div class="ph"><div class="eyebrow">${t('nav_calendar')}</div><h1>${t('calTitle')}</h1><p>${t('calSub')}</p></div>
   ${days.length?days.map(k=>{ const its=groups[k];
      return `<div class="tl-day"><div class="tl-date"><b>${fmtDay(its[0].scheduledFor)}</b><span>${its.length} ${t('nav_content')}</span></div>
        ${its.map(it=>{const[cls,lbl]=STATUS_BADGE[it.status];return `<div class="card tl-item" data-id="${it.id}">
          <span class="tl-time">${fmtTime(it.scheduledFor)}</span>
          <span style="font-size:18px">${platIcon(it.platform)}</span>
          <div style="flex:1;min-width:0"><b style="font-size:14.5px">${esc(it.title)}</b>
            <div class="meta">${esc(it.type)}${isStudio()?' · '+esc(clientName(it.client)):''}</div></div>
          <span class="badge ${cls}"><span class="dot"></span>${t(lbl)}</span></div>`;}).join('')}</div>`;
    }).join(''):emptyBox(t('noItems'))}`;
};
AFTER.calendar=()=>{ $$('.tl-item[data-id]').forEach(c=>c.onclick=()=>openItem(DB.content.find(x=>x.id===c.dataset.id))); };

/* Ranking */
RENDER.ranking=()=>{
  const list=[...DB.content].filter(x=>isStudio()||x.client===ME.id)
    .map(x=>({...x,s:score(x)})).sort((a,b)=>b.s-a.s).slice(0,10);
  return `<div class="ph"><div class="eyebrow">${t('nav_ranking')}</div><h1>${t('rankTitle')}</h1><p>${t('rankSub')}</p></div>
   <div class="items">${list.map((it,i)=>{const medal=['🥇','🥈','🥉'][i]||('#'+(i+1)); const col=avatarColor(it.client);
     return `<div class="card rank ${i<3?'top'+(i+1):''}" data-id="${it.id}">
       <span class="pos">${medal}</span>
       <span class="thumb" style="width:46px;height:46px;aspect-ratio:1;font-size:18px;background:linear-gradient(135deg,${col},${col}aa)">${esc(it.type[0])}</span>
       <div style="flex:1;min-width:0"><b style="font-size:15px">${esc(it.title)}</b>
         <div class="meta">${esc(it.platform)}${isStudio()?' · '+esc(clientName(it.client)):''} · ❤️ ${it.likes} · 🗳️ ${it.votes} · 💬 ${it.comments.length}</div></div>
       <span class="score"><b>${it.s}</b><span>${t('pts')}</span></span></div>`;}).join('')}</div>`;
};
AFTER.ranking=()=>{ $$('.rank[data-id]').forEach(c=>c.onclick=()=>openItem(DB.content.find(x=>x.id===c.dataset.id))); };

/* Community voting */
RENDER.community=()=>{
  const list=[...DB.community].sort((a,b)=>b.votes-a.votes);
  return `<div class="ph"><div class="eyebrow">${t('nav_community')}</div><h1>${t('commTitle')}</h1><p>${t('commSub')}</p></div>
   <div class="card" style="padding:16px;margin-bottom:18px">
     <label style="font-size:13px;font-weight:600;color:var(--ink-2);display:block;margin-bottom:8px">${t('addIdea')}</label>
     <div class="composer" style="margin-top:0"><textarea id="ideaTx" rows="1" placeholder="${t('ideaPh')}"></textarea><button class="btn btn-p btn-sm" id="ideaPost">${t('post')}</button></div>
   </div>
   <div class="items" id="voteList">${list.map(voteCard).join('')}</div>`;
};
function voteCard(v){ const my=v.voters[ME.id]; const col=avatarColor(v.client);
  return `<div class="card vote" data-id="${v.id}">
    <div class="vbtns">
      <button class="vbtn up ${my===1?'on':''}" data-v="1" data-id="${v.id}">▲</button>
      <span class="vscore">${v.votes}</span>
      <button class="vbtn down ${my===-1?'on':''}" data-v="-1" data-id="${v.id}">▼</button>
    </div>
    <div style="flex:1;min-width:0">
      <span class="badge ${v.kind==='content'?'b-scheduled':'b-published'}" style="margin-bottom:6px"><span class="dot"></span>${v.kind==='content'?t('nav_content'):t('addIdea')}</span>
      <p style="font-size:14.5px;line-height:1.6">${esc(v.text)}</p>
      <div class="who">${t('by')} <b style="color:${col}">${esc(v.author)}</b>${v.refTitle?' · «'+esc(v.refTitle)+'»':''}</div>
    </div></div>`;
}
AFTER.community=()=>{
  $$('[data-v]').forEach(b=>b.onclick=()=>{ const v=DB.community.find(x=>x.id===b.dataset.id); const dir=+b.dataset.v;
    const cur=v.voters[ME.id]||0; if(cur===dir){ v.votes-=dir; delete v.voters[ME.id]; } else { v.votes+=dir-cur; v.voters[ME.id]=dir; }
    save(); $('#voteList').innerHTML=[...DB.community].sort((a,b)=>b.votes-a.votes).map(voteCard).join(''); AFTER.community();
  });
  $('#ideaPost').onclick=()=>{ const tx=$('#ideaTx').value.trim(); if(!tx)return;
    DB.community.unshift({id:'v'+Date.now(),kind:'note',client:ME.id,text:tx,votes:1,voters:{[ME.id]:1},author:isStudio()?'RankRise':me().name});
    save(); toast(t('added')); go('community');
  };
};

/* Messages */
RENDER.messages=()=>{
  const cid=ME.id; const thread=DB.messages[cid]||(DB.messages[cid]=[]);
  return `<div class="ph"><div class="eyebrow">${t('nav_messages')}</div><h1>${t('msgTitle')}</h1><p>${t('msgSub')}</p></div>
   <div class="card" style="padding:18px">
     <div class="thread" id="msgThread">${thread.length?thread.map(msgBubble).join(''):emptyBox(t('noItems'))}</div>
     <div class="composer"><textarea id="msgTx" rows="1" placeholder="${t('typeMsg')}"></textarea><button class="btn btn-p" id="msgSend">${t('send')}</button></div>
   </div>`;
};
function msgBubble(m){ const mine=(m.from==='client'&&!isStudio())||(m.from==='team'&&isStudio());
  return `<div class="msg ${mine?'me':''}"><span class="avatar" style="background:${m.from==='team'?'#0e0e13':'#7062f0'}">${m.from==='team'?'RR':initials(m.nm)}</span>
    <div class="bubble"><div class="nm">${esc(m.nm)}</div><div class="tx">${esc(m.tx)}</div><div class="tm">${ago(m.ts)}</div></div></div>`; }
AFTER.messages=()=>{
  const cid=ME.id;
  $('#msgSend').onclick=()=>{ const v=$('#msgTx').value.trim(); if(!v)return;
    DB.messages[cid].push({from:isStudio()?'team':'client',nm:isStudio()?'RankRise':me().name,tx:v,ts:Date.now()});
    save(); notify(cid,'💬','رسالة جديدة بالتواصل'); toast(t('sent'));
    $('#msgThread').innerHTML=DB.messages[cid].map(msgBubble).join(''); $('#msgTx').value=''; updateBell();
    $('#msgThread').scrollTop=$('#msgThread').scrollHeight;
  };
};

/* Studio (admin) */
RENDER.studio=()=>{
  return `<div class="ph"><div class="eyebrow">${t('nav_studio')}</div><h1>${t('studioTitle')}</h1><p>${t('studioSub')}</p></div>
   <div class="card" style="padding:20px;max-width:560px">
     <h3 style="font-size:17px;margin-bottom:16px">${t('newContent')}</h3>
     <div class="field"><label>${t('cclient')}</label><select id="s_client">${DB.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
     <div class="field"><label>${t('ctitle')}</label><input id="s_title" placeholder="…"></div>
     <div class="grid" style="grid-template-columns:1fr 1fr;gap:12px">
       <div class="field"><label>${t('ctype')}</label><select id="s_type"><option>Reel</option><option>Post</option><option>Carousel</option><option>Story</option></select></div>
       <div class="field"><label>${t('cplatform')}</label><select id="s_pf"><option>Instagram</option><option>TikTok</option><option>LinkedIn</option><option>Facebook</option><option>YouTube</option></select></div>
     </div>
     <div class="field"><label>${t('ccaption')}</label><textarea id="s_cap" rows="3" placeholder="…"></textarea></div>
     <div class="field"><label>${t('cdate')}</label><input id="s_date" type="date"></div>
     <button class="btn btn-d btn-block" id="s_create">${t('create')}</button>
   </div>`;
};
AFTER.studio=()=>{
  $('#s_create').onclick=()=>{ const title=$('#s_title').value.trim(); if(!title){toast('…');return;}
    const cid=$('#s_client').value; const dstr=$('#s_date').value;
    DB.content.unshift({id:'c'+Date.now(),client:cid,title,type:$('#s_type').value,platform:$('#s_pf').value,
      caption:$('#s_cap').value.trim(),status:'pending',scheduledFor:dstr?new Date(dstr).getTime():Date.now()+3*864e5,
      likes:0,votes:0,voters:{},comments:[],createdAt:Date.now()});
    save(); notify(cid,'📥',`محتوى جديد «${title}» بانتظار موافقتك`); toast(t('sent')); go('content');
  };
};

/* ---------- notifications panel ---------- */
function openNotifs(){ renderNotifs(); $('#notifPanel').classList.add('open'); $('#scrim').classList.add('on'); }
function closeNotifs(){ $('#notifPanel').classList.remove('open'); $('#scrim').classList.remove('on'); }
function renderNotifs(){
  const list=myNotifs();
  $('#notifList').innerHTML=list.length?list.map(n=>`<div class="notif ${n.read?'':'unread'}" data-nid="${n.id}">
     <span class="nic">${n.ic}</span><div><div class="ntx">${esc(n.tx)}${isStudio()?` <b style="color:var(--accent-2)">· ${esc(clientName(n.client))}</b>`:''}</div><div class="ntm">${ago(n.ts)}</div></div></div>`).join('')
     :`<div class="empty"><div class="em-ic">🔔</div>${t('noNotifs')}</div>`;
  $$('[data-nid]').forEach(el=>el.onclick=()=>{ const n=DB.notifs.find(x=>x.id===el.dataset.nid); n.read=true; save(); renderNotifs(); updateBell(); go('content'); closeNotifs(); });
}

/* ---------- modal / prompt ---------- */
function openModal(){ $('#modalScrim').classList.add('on'); }
function closeModal(){ $('#modalScrim').classList.remove('on'); }
$('#modalScrim').onclick=e=>{ if(e.target.id==='modalScrim') closeModal(); };
function modalPrompt(title,label,cb){
  $('#modal').innerHTML=`<div class="modal-head"><h2>${title}</h2><button class="modal-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body"><div class="field"><label>${label}</label><textarea id="mpTx" rows="3" autofocus></textarea></div>
    <button class="btn btn-p btn-block" id="mpOk">${t('send')}</button></div>`;
  openModal(); $('#mpOk').onclick=()=>cb($('#mpTx').value.trim());
}

/* ---------- misc ---------- */
function emptyBox(msg){ return `<div class="empty"><div class="em-ic">📭</div>${msg}</div>`; }
function refresh(){ renderChrome(); go(VIEW); }
function profileMenu(){
  $('#modal').innerHTML=`<div class="modal-head"><h2>${esc(isStudio()?'RankRise':me().name)}</h2><button class="modal-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <button class="btn btn-o btn-block" style="margin-bottom:10px" onclick="closeModal();logout()">↩︎ ${t('switch')}</button>
      <button class="btn btn-o btn-block" onclick="resetDemo()">♻︎ ${LANG==='ar'?'إعادة ضبط البيانات التجريبية':'Reset demo data'}</button>
    </div>`;
  openModal();
}
function logout(){ localStorage.removeItem('rr_me'); ME=null; $('#app').classList.add('hide'); $('#login').classList.remove('hide'); closeModal(); }
function resetDemo(){ localStorage.removeItem(KEY); DB=load(); closeModal(); toast(LANG==='ar'?'تمت إعادة الضبط':'Reset done'); refresh(); }

/* ---------- boot ---------- */
initLogin();
try{ const saved=JSON.parse(localStorage.getItem('rr_me')); if(saved&&DB.clients.find(c=>c.id===saved.id)){ ME=saved; enterApp(); } }catch(e){}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>RankRise Ascend — Diagnose the business. Then build the plan.</title>
<meta name="description" content="A marketing system that starts with a consultation, not a caption. Ascend scores how ready a business is to market, names what is costing it money, and builds the 90-day plan that follows.">
<meta name="theme-color" content="#08080d">
<meta name="robots" content="noindex">

<meta property="og:type" content="website">
<meta property="og:title" content="RankRise Ascend">
<meta property="og:description" content="Most marketing tools start at the post. This one starts at the business.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles/app.css">
<link rel="stylesheet" href="styles/flow.css">

<style>
  /* Print is a real surface here: the diagnosis is the thing an owner
     forwards to a partner, and a judge asked for "something to take away"
     should get a clean page rather than a screenshot of a dark UI. */
  @media print{
    .aurora,.topbar,.nav-row,.sample-note{ display:none !important; }
    body{ background:#fff; color:#111; }
    .card,.pillars,.pillar{ background:#fff; border-color:#ddd; }
    .lede,.muted,.pillar-note,.finding p{ color:#333; }
    .rise{ animation:none; opacity:1; transform:none; }
    .ring .fill{ animation:none; stroke-dashoffset:var(--offset); }
    .pillar-bar i{ animation:none; width:var(--w); }
  }
</style>
</head>

<body>
  <div class="aurora" aria-hidden="true"></div>
  <div class="shell" id="app"></div>

  <noscript>
    <div class="wrap" style="padding-block:80px">
      <h1 class="h1">RankRise Ascend</h1>
      <p class="lede" style="margin-top:20px">This app needs JavaScript enabled.</p>
    </div>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>

# Netlify configuration — static site served from the repo root
[build]
  publish = "."
  command = ""

# Long-cache the cover images and project assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Demo store: unknown /shop/* URLs get the store's own 404 page
# (only applies when no real file matches the path).
[[redirects]]
  from = "/shop/*"
  to = "/shop/404.html"
  status = 404

# Store admin panel: never indexed, never framed, always fresh
[[headers]]
  for = "/shop/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
    Cache-Control = "no-cache"

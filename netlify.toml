# Netlify configuration — static site served from the repo root
[build]
  publish = "."
  command = ""

# Long-cache the cover images and project assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The Lebanon Market Tracker app lives in this repo but is deployed separately;
# never serve its source tree from the marketing site.
[[redirects]]
  from = "/lebanon-market-tracker/*"
  to = "/404.html"
  status = 404
  force = true

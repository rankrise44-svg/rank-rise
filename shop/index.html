<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cedarline — Kitchen Essentials, Delivered Across Lebanon</title>
<meta name="description" content="Cookware, bakeware, kitchen tools, storage, tableware and appliances, delivered across Lebanon. Order with cash on delivery or on WhatsApp.">
<!-- Demo store with fictional products: keep it out of search until it goes live. -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#18181a">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script type="module" src="js/pages/home.js"></script>
</head>
<body data-page="home">
<div id="site-header"></div>
<main id="main" tabindex="-1">
  <section class="hero" aria-roledescription="carousel" aria-label="Featured collections" data-hero>
    <div class="hero__track" data-hero-track></div>
    <button class="hero__nav hero__nav--prev" type="button" data-hero-prev aria-label="Previous slide" data-icon="left"></button>
    <button class="hero__nav hero__nav--next" type="button" data-hero-next aria-label="Next slide" data-icon="right"></button>
    <div class="hero__dots" data-hero-dots></div>
    <button class="hero__pause" type="button" data-hero-pause aria-label="Pause slideshow">Pause</button>
  </section>
  <div class="features">
    <div class="container"><ul class="features__list" data-features></ul></div>
  </div>

  <section class="section" id="categories" aria-labelledby="cats-title">
    <div class="container">
      <div class="section__head">
        <h2 id="cats-title">Shop by Category</h2>
        <a class="section__link" href="shop.html" data-arrow>View all categories</a>
      </div>
      <div class="cats" data-cats></div>
    </div>
  </section>

  <section class="section section--tight" aria-labelledby="deals-title">
    <div class="container">
      <div class="section__head">
        <h2 id="deals-title">Today’s Best Deals</h2>
        <div class="section__tools">
          <a class="section__link" href="shop.html?collection=deals" data-arrow>View all deals</a>
          <button class="rail__btn" type="button" data-rail-prev aria-controls="deals-rail" aria-label="Previous deals" data-icon="left"></button>
          <button class="rail__btn" type="button" data-rail-next aria-controls="deals-rail" aria-label="More deals" data-icon="right"></button>
        </div>
      </div>
      <div class="rail"><div class="rail__track" id="deals-rail" data-deals aria-busy="true" tabindex="0" aria-label="Today’s best deals, scrollable"></div></div>
    </div>
  </section>

  <section class="section section--tight" aria-label="Featured collections">
    <div class="container"><div class="banners" data-banners></div></div>
  </section>

  <section class="section section--tight" aria-label="Why shop with us">
    <div class="container"><ul class="values" data-values></ul></div>
  </section>

  <section class="section section--tight" aria-labelledby="best-title">
    <div class="container">
      <div class="section__head">
        <h2 id="best-title">Best Sellers</h2>
        <a class="section__link" href="shop.html?collection=bestsellers" data-arrow>Shop best sellers</a>
      </div>
      <div class="grid grid--6" data-best aria-busy="true"></div>
    </div>
  </section>

  <section class="section section--tight" aria-labelledby="brands-title" style="padding-bottom:56px">
    <div class="container">
      <div class="section__head">
        <h2 id="brands-title">Top Brands</h2>
        <a class="section__link" href="brands.html" data-arrow>View all brands</a>
      </div>
      <div class="brand-row" data-brands></div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<noscript><p style="padding:16px;text-align:center">Please enable JavaScript to shop at Cedarline.</p></noscript>
</body>
</html>

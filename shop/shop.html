<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop All Products — Cedarline</title>
<meta name="description" content="Browse Cedarline’s home essentials: kitchen, storage, cleaning, bathroom and home accessories.">
<!-- Demo store with fictional products: keep it out of search until it goes live. -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script type="module" src="js/pages/shop.js"></script>
</head>
<body data-page="shop">
<div id="site-header"></div>
<main id="main" tabindex="-1">
  <div class="container">
    <nav class="crumbs" aria-label="Breadcrumb"><ol><li><a href="index.html">Home</a></li><li data-crumb-current aria-current="page">Shop</li></ol></nav>
    <header class="page-head">
      <h1 data-shop-title>All products</h1>
      <p class="muted" data-shop-blurb>Natural materials, honest prices, delivered across Lebanon.</p>
    </header>
    <div class="shop">
      <aside class="filters" id="filters" data-filters aria-label="Filters">
        <div class="filters__head">
          <h2>Filters</h2>
          <button class="icon-btn" type="button" data-filters-close data-icon="close" aria-label="Close filters"></button>
        </div>
        <form data-filter-form novalidate>
          <fieldset class="fgroup">
            <legend>Category</legend>
            <div data-filter-cats></div>
          </fieldset>
          <fieldset class="fgroup">
            <legend>Price (USD)</legend>
            <div class="price-range">
              <label><span class="sr-only">Minimum price</span><input class="input" type="number" name="min" min="0" step="1" inputmode="numeric" placeholder="Min"></label>
              <span class="sep">–</span>
              <label><span class="sr-only">Maximum price</span><input class="input" type="number" name="max" min="0" step="1" inputmode="numeric" placeholder="Max"></label>
            </div>
            <p class="field__error" data-price-error role="alert"></p>
          </fieldset>
          <fieldset class="fgroup">
            <legend>Availability</legend>
            <label class="check"><input type="checkbox" name="stock" value="1"> In stock only</label>
            <label class="check"><input type="checkbox" name="sale" value="1"> On sale</label>
          </fieldset>
          <button type="button" class="btn btn--link" data-clear-filters style="margin-top:16px">Clear all filters</button>
        </form>
        <div class="filters__foot">
          <button type="button" class="btn btn--ghost" data-clear-filters>Clear</button>
          <button type="button" class="btn btn--dark" data-filters-close data-filters-apply>Show results</button>
        </div>
      </aside>
      <section aria-labelledby="results-label">
        <div class="toolbar">
          <p class="toolbar__count" id="results-label" data-result-count aria-live="polite">Loading products…</p>
          <div class="toolbar__right">
            <button type="button" class="btn btn--ghost btn--sm filters-toggle" data-filters-open aria-controls="filters" aria-expanded="false"></button>
            <label class="sr-only" for="sort">Sort by</label>
            <select class="select" id="sort" data-sort></select>
          </div>
        </div>
        <div class="chips" data-chips></div>
        <div class="grid" data-results aria-busy="true"></div>
      </section>
    </div>
  </div>
</main>
<div id="site-footer"></div>
<noscript><p style="padding:16px;text-align:center">Please enable JavaScript to shop at Cedarline.</p></noscript>
</body>
</html>

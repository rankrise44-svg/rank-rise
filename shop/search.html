<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Search — Cedarline</title>
<meta name="description" content="Search Cedarline’s home essentials.">
<!-- Demo store with fictional products: keep it out of search until it goes live. -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script type="module" src="js/pages/search.js"></script>
</head>
<body data-page="search">
<div id="site-header"></div>
<main id="main" tabindex="-1">
  <div class="container">
    <header class="page-head">
      <p class="eyebrow">Search</p>
      <h1 data-search-title>Search products</h1>
    </header>
    <form class="search-inline" action="search.html" role="search" style="max-width:560px;margin-top:20px">
      <label class="sr-only" for="q-page">Search products</label>
      <input id="q-page" name="q" type="search" placeholder="Try “towel”, “glass” or “kitchen”" maxlength="80" data-search-page-input>
      <button type="submit" aria-label="Search" data-icon="search"></button>
    </form>
    <div class="toolbar" data-search-toolbar hidden style="margin-top:24px">
      <p class="toolbar__count" data-search-count aria-live="polite"></p>
      <div class="toolbar__right">
        <label class="sr-only" for="search-sort">Sort by</label>
        <select class="select" id="search-sort" data-search-sort></select>
      </div>
    </div>
    <div data-search-root style="padding:8px 0 72px"></div>
  </div>
</main>
<div id="site-footer"></div>
<noscript><p style="padding:16px;text-align:center">Please enable JavaScript to shop at Cedarline.</p></noscript>
</body>
</html>
